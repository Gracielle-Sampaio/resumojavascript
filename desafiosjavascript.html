<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Ano Bissexto</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction:column;
            gap:20px;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        div {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #333;
        }
        input[type="number"] {
            padding: 10px;
            margin-left: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            width: 120px;
            text-align: center;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <div>
        <label>Esse ano é bissexto?
            <input type="number" id="ano" name="ano" placeholder="Digite o ano">
        </label>
        <input type="submit" value="Verificar" onclick="enviar()">
        <p id="resultado"></p>
    </div>

    <div><label>Qual a temperatura atual em Fahrenheit?
         <input type="number" id="temperatura" name="temperatura" placeholder="Qual a temperatura atual?">
    </label>
         <input type="submit" value="Verificar clima" onclick="clima()">
    </div>
    <script>
        

        function enviar() {
            
            let ano = Number(document.getElementById('ano').value)
            let resultado = document.getElementById('resultado')

            
            if (ano === '') {
                resultado.innerHTML += '<p>Por favor, digite um ano.</p>';
                resultado.style.color = 'orange';
            } else {
                const anoNumerico = parseInt(ano);
                if (isNaN(anoNumerico)) {
                    resultadoElement.textContent = 'Por favor, digite um número válido.';
                    resultadoElement.style.color = 'red';
                } else if ((anoNumerico % 4 === 0 && anoNumerico % 100 !== 0) || (anoNumerico % 400 === 0)) {
                    resultadoElement.textContent = `O ano ${anoNumerico} é bissexto!`;
                    resultadoElement.style.color = 'green';
                } else {
                    resultadoElement.textContent = `O ano ${anoNumerico} não é bissexto.`;
                    resultadoElement.style.color = 'red';
                }
            }
        });
    </script>
</body>
</html>
