<!DOCTYPE html>
<html lang="pt-br>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device=width,initial=scale=1.0">
<title> Resumo Javascript</title>
<style>
div {
  margin-top: 5%;
  background-color: #f5f5d5;
  padding: 50px;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-content: center;
  align-items: center;
}

button {
  height: 50px;
  width: 150px;
  border-radius: 10px;
  background-color: white;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
}

button:hover {
  background-color: black;
  color:white;
}

</style>
</head>
<body>
<div class="cor">
  <button onclick="clicou()">Clique aqui</button>
</div>

<div class="nome">
  <button onclick="nome()">Qual seu nome?</button>
</div>
<div class="caixa">
  <button onclick="caixa()">Digite uma tarefa aqui!</button>
  <section id="resultado">
    <p></p>
  </section>
</div>
<script>
function clicou() {
  window.alert("Olá, mundo!");
  document.querySelector(".cor").style.backgroundColor = "black";
  console.log("clicou");
}

function nome() {
  let nome = window.prompt("Digite seu nome:");
  window.alert(`Olá, ${nome}! É um prazer te conhecer!`);
}
function caixa(){
  let texto = window.prompt("Escreva uma tarefa:");
  let res = window.document.getElementById('resultado');
  res.innerHTML = `Sua tarefa: ${res} &#x1F596`
}

</script>

</body>
</html>
